[build]
  command = "npm run build"

# Next.js App Router（/api/* 含む）を Netlify 本番で動かす公式プラグイン
[[plugins]]
  package = "@netlify/plugin-nextjs"

# 実行上限（変更不可）：同期60秒／スケジュール30秒／バックグラウンド15分
[functions]
  node_bundler = "esbuild"

# タスクY: 勤怠の定時リスト送信。
# cron は **UTC 固定**でタイムゾーンを指定できない。日本には夏時間が無いので
# JST = UTC+9 の固定換算でよい。関数の中身は薄い引き金で、集計と送信は
# Next.js 側（/api/attendance/list-notify）が行う。
# 9:32 JST = 0:32 UTC
[functions."attendance-list-morning"]
  schedule = "32 0 * * *"
# 19:55 JST = 10:55 UTC
[functions."attendance-list-evening"]
  schedule = "55 10 * * *"

[build.environment]
  NODE_VERSION = "20"
  # Secrets Controller がビルド成果物に埋め込まれた値と突き合わせる。
  # @pocket のフィールド uniqueId（field_*）やアプリ ID はサーバー用バンドル・ソースマップに現れやすく誤検知するため除外する。
  # 実際のシークレット（API キー等）は除外しないこと。
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_LIFF_ID,LINE_LOGIN_CHANNEL_ID,STAFF_APP_ID,LOG_APP_ID,STAFF_NAME_FIELD_ID,STAFF_CONSTRUCTION_AVAILABILITY_FIELD_ID,STAFF_CONSTRUCTION_AVAILABILITY_ACTIVE_LABEL,STAFF_LINE_USER_ID_1_FIELD_ID,STAFF_LINE_USER_ID_2_FIELD_ID,STAFF_LINE_USER_ID_FIELD_ID,STAFF_LINE_USER_ID_FIELD_ID_2,STAFF_IMPORT_KEY_FIELD_ID,STAFF_IMPORT_KEY_SOURCE_FIELD_IDS,STAFF_BIND_ALWAYS_INCLUDE_FIELD_IDS,LOG_FIELD_LINE_USER_ID,LOG_FIELD_STAFF_NAME,LOG_FIELD_CUSTOMER_NAME,LOG_FIELD_CONTENT,LOG_FIELD_STAFF_RECORD_ID,CALENDAR_APP_ID,CALENDAR_CONTRACTOR_FIELD_ID,CALENDAR_START_DATE_FIELD_ID,CALENDAR_SHIGUMI_DATE_FIELD_ID,CALENDAR_PANEL_WORK_DATE_FIELD_ID,CALENDAR_ELECTRIC_WORK_DATE_FIELD_ID,CALENDAR_APP_SETTINGS_DATE_FIELD_ID,CALENDAR_EMPTY_FILL_CUSTOMER_NAME_FIELD_ID,CALENDAR_EMPTY_FILL_HOUSING_STATUS_FIELD_ID,CALENDAR_EMPTY_FILL_TNUMBER_FIELD_ID,CALENDAR_EMPTY_FILL_CONSTRUCTION_HANDLER_FIELD_ID,CALENDAR_EMPTY_FILL_CONSTRUCTION_REGISTRANT_FIELD_ID,CALENDAR_EMPTY_FILL_TITLE_FIELD_ID,CALENDAR_REPORT_APP_ID,COMMUNICATION_BRIDGE_CALENDAR_APP_ID,WORK_END_REPORT_APP_ID,WORK_END_REPORT_REPORTER_FIELD_ID,WORK_END_REPORT_STAFF_NAME_FIELD_ID,WORK_END_REPORT_PINPON_COUNT_FIELD_ID,WORK_END_REPORT_MEETING_COUNT_FIELD_ID,WORK_END_REPORT_APO_COUNT_FIELD_ID,WORK_END_REPORT_APO_ACTIVITY_FIELD_ID,WORK_END_REPORT_DATE_FIELD_ID,WORK_END_REPORT_WORK_AREA_FIELD_ID,ATPOCKET_DOMAIN"

# フレームワーク自体がキャッシュヘッダを付与するため、追加の強制キャッシュは避ける
