[build]
  command = "npm run build"

# Next.js App Router（/api/* 含む）を Netlify 本番で動かす公式プラグイン
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Secrets Controller がビルド成果物に埋め込まれた値と突き合わせる。
  # @pocket のフィールド uniqueId（field_*）やアプリ ID はサーバー用バンドル・ソースマップに現れやすく誤検知するため除外する。
  # 実際のシークレット（API キー等）は除外しないこと。
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_LIFF_ID,LINE_LOGIN_CHANNEL_ID,STAFF_APP_ID,LOG_APP_ID,STAFF_NAME_FIELD_ID,STAFF_LINE_USER_ID_FIELD_ID,STAFF_LINE_USER_ID_FIELD_ID_2,LOG_FIELD_LINE_USER_ID,LOG_FIELD_STAFF_NAME,LOG_FIELD_CUSTOMER_NAME,LOG_FIELD_CONTENT,LOG_FIELD_STAFF_RECORD_ID,CALENDAR_APP_ID,CALENDAR_EMPTY_FILL_CUSTOMER_NAME_FIELD_ID,CALENDAR_EMPTY_FILL_HOUSING_STATUS_FIELD_ID,CALENDAR_EMPTY_FILL_TNUMBER_FIELD_ID,CALENDAR_EMPTY_FILL_TITLE_FIELD_ID,CALENDAR_REPORT_APP_ID,ATPOCKET_DOMAIN"

# フレームワーク自体がキャッシュヘッダを付与するため、追加の強制キャッシュは避ける
